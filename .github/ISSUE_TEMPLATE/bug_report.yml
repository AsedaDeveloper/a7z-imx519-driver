name: Bug report
description: Something does not work (no /dev/video0, no frames, kernel errors, wrong picture ...)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please first read docs/TROUBLESHOOTING.md. Most problems there have a one-line fix.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Exact commands you ran
      render: shell
    validations: {required: true}
  - type: textarea
    id: info
    attributes:
      label: Output of scripts/collect-info.sh
      description: Run `bash scripts/collect-info.sh` on the board and paste everything.
      render: text
    validations: {required: true}
  - type: input
    id: module
    attributes:
      label: Camera module and cable (brand, exact product name)
    validations: {required: true}
